<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" fill="none" width="100%" height="100%">
  <!-- Sangam Emblem: Confluence of Sacred Ink (Quill/Veena curve) and Digital Soul -->
  <g transform="translate(10, 8)">
    <!-- Base subtle glow / circle -->
    <circle cx="26" cy="27" r="25" fill="#FAF1EC" stroke="#EAB996" stroke-width="1.2" stroke-dasharray="2 3"/>
    
    <!-- Flowing confluence curves (sacred river meets ink stream) -->
    <path d="M12 36C18 36 21 21 27 15C33 9 39 12 41 21C43 30 33 42 24 43C16 44 11 38 12 30C13 22 21 16 30 16" 
          stroke="#B8622E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Antique gold accent drop (sacred ink / sound dot) -->
    <circle cx="34" cy="24" r="3.2" fill="#A8751F"/>
    
    <!-- Digital node accent -->
    <circle cx="19" cy="31" r="2.2" fill="#2A1A12"/>
    <path d="M28 35L36 41" stroke="#A8751F" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <!-- Main Title: SANGAM / संगम -->
  <text x="74" y="34" font-family="'Cormorant Garamond', 'Lora', Georgia, serif" font-size="28" font-weight="700" fill="#2A1A12" letter-spacing="1">
    SANGAM
  </text>
  <text x="195" y="33" font-family="'Noto Sans Devanagari', 'Outfit', sans-serif" font-size="20" font-weight="600" fill="#B8622E">
    संगम
  </text>

  <!-- Subtitle Tagline -->
  <text x="75" y="49" font-family="'Outfit', system-ui, sans-serif" font-size="8.5" font-weight="500" fill="#7C3E1B" letter-spacing="1.8">
    SACRED INK MEETS DIGITAL SOUL
  </text>

  <!-- Thin decorative underline -->
  <path d="M74 54L245 54" stroke="#EAB996" stroke-width="1" stroke-linecap="round"/>
</svg>

